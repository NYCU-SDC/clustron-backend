name: clustron-stage

services:
  backend:
    image: nycusdc/clustron-backend:stage
    networks:
      - internal
      - traefik
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_healthy
    environment:
      - ENV=stage
      - HOST=0.0.0.0
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - NYCU_OAUTH_CLIENT_ID=${NYCU_OAUTH_CLIENT_ID}
      - NYCU_OAUTH_CLIENT_SECRET=${NYCU_OAUTH_CLIENT_SECRET}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      - SECRET=${SECRET}
      - DATABASE_URL=postgres://postgres:password@postgres:5432/clustron?sslmode=disable
      - BASE_URL=https://api.stage.clustron.sdc.nycu.club
      - SLURM_TOKEN_HELPER_URL=${SLURM_TOKEN_HELPER_URL}
      - SLURM_RESTFUL_BASE_URL=${SLURM_RESTFUL_BASE_URL}
      - SLURM_RESTFUL_VERSION=v0.0.43
      - MIGRATION_SOURCE=file:///app/migrations
      - CASBIN_POLICY_SOURCE=policy.csv
      - CASBIN_MODEL_SOURCE=model.conf
      - ALLOW_ORIGINS=*
      - LDAP_DEBUG=true
      - LDAP_HOST=ldap
      - LDAP_PORT=389
      - LDAP_BASE_DN=dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club
      - LDAP_BIND_DN=cn=admin,dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club
      - LDAP_USER_OU_NAME=People
      - LDAP_GROUP_OU_NAME=Groups
      - LDAP_BIND_PWD=password
      # Uncomment once ./certs holds a CA that covers the address nodes dial;
      # managed nodes then verify the LDAP server instead of trusting any cert.
      # - LDAP_CA_CERT_FILE=/app/certs/ca.crt
      - OTEL_COLLECTOR_URL=10.140.0.3:4317
      - REDIS_URL=redis:6379
    volumes:
      - ./certs:/app/certs:ro
    labels:
      - "vector.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.clustron-backend-stage.rule=Host(`api.stage.clustron.sdc.nycu.club`)"
      - "traefik.http.routers.clustron-backend-stage.entrypoints=websecure"
      - "traefik.http.routers.clustron-backend-stage.tls=true"
      - "traefik.http.routers.clustron-backend-stage.tls.certresolver=cloudflare"
      - "traefik.http.services.clustron-backend-stage.loadbalancer.server.port=8080"

  postgres:
    image: postgres:18
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clustron
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - internal

  ldap:
    image: osixia/openldap:1.5.0
    healthcheck:
      test: ["CMD", "cat", "/run/slapd/slapd.pid"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      LDAP_ORGANISATION: "Clustron"
      LDAP_DOMAIN: "clustron.prj.internal.sdc.nycu.club"
      LDAP_ADMIN_PASSWORD: "password"
      LDAP_BASE_DN: "dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club"
      KEEP_EXISTING_CONFIG: "false"
      # slapd serves 389 and 636 from the same process; osixia demands a
      # client certificate by default, which SSSD does not present.
      LDAP_TLS_VERIFY_CLIENT: "try"
      # Signed by scripts/create_ldap_certs.sh. If ./certs is empty the image
      # falls back to generating its own self-signed pair under these names.
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
    volumes:
      - ./ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - ./certs:/container/service/slapd/assets/certs
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    command: --copy-service --loglevel debug
    ports:
      - "636:636"
    networks:
      - internal

  redis:
    image: redis:8.6.4
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
  traefik:
    external: true

volumes:
  db-data:
  ldap-data:
  ldap-config: