name: clustron-stage

services:
  backend:
    image: nycusdc/clustron-backend:stage
    networks:
      - internal
      - traefik
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_healthy
    environment:
      - ENV=stage
      - HOST=0.0.0.0
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - NYCU_OAUTH_CLIENT_ID=${NYCU_OAUTH_CLIENT_ID}
      - NYCU_OAUTH_CLIENT_SECRET=${NYCU_OAUTH_CLIENT_SECRET}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}
      - SECRET=${SECRET}
      - DATABASE_URL=postgres://postgres:password@postgres:5432/clustron?sslmode=disable
      - BASE_URL=https://api.stage.clustron.sdc.nycu.club
      - SLURM_TOKEN_HELPER_URL=${SLURM_TOKEN_HELPER_URL}
      - SLURM_RESTFUL_BASE_URL=${SLURM_RESTFUL_BASE_URL}
      - SLURM_RESTFUL_VERSION=v0.0.43
      - MIGRATION_SOURCE=file:///app/migrations
      - CASBIN_POLICY_SOURCE=policy.csv
      - CASBIN_MODEL_SOURCE=model.conf
      - ALLOW_ORIGINS=*
      - LDAP_DEBUG=true
      - LDAP_HOST=ldap
      - LDAP_PORT=3890
      - LDAP_BASE_DN=dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club
      - LDAP_BIND_DN=cn=admin,dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club
      - LDAP_USER_OU_NAME=People
      - LDAP_GROUP_OU_NAME=Groups
      - LDAP_BIND_PWD=password
      - OTEL_COLLECTOR_URL=10.140.0.3:4317
      - REDIS_URL=redis:6379
    labels:
      - "vector.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.clustron-backend-stage.rule=Host(`api.stage.clustron.sdc.nycu.club`)"
      - "traefik.http.routers.clustron-backend-stage.entrypoints=websecure"
      - "traefik.http.routers.clustron-backend-stage.tls=true"
      - "traefik.http.routers.clustron-backend-stage.tls.certresolver=cloudflare"
      - "traefik.http.services.clustron-backend-stage.loadbalancer.server.port=8080"

  postgres:
    image: postgres:18
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clustron
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - internal

  ldap:
    image: osixia/openldap:2.6.10-alpha
    healthcheck:
      test: ["CMD", "container", "run", "--", "ldapwhoami", "-x", "-H", "ldap://localhost:3890"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      OPENLDAP_BOOTSTRAP_ORGANIZATION: "Clustron"
      OPENLDAP_BOOTSTRAP_SUFFIX: "dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club"
      # nis.ldif (not the image default rfc2307bis) keeps posixGroup STRUCTURAL,
      # and openssh-lpk.ldif provides ldapPublicKey/sshPublicKey (overridden
      # by ./schema so sshPublicKey stays MAY instead of the image's MUST).
      OPENLDAP_BOOTSTRAP_SCHEMAS: "core.ldif cosine.ldif inetorgperson.ldif nis.ldif openssh-lpk.ldif"
      OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: "password"
      OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED: "password"
    volumes:
      - ./ldif:/container/services/openldap-bootstrap/assets/ldif/data/custom:ro
      - ./schema/openssh-lpk.ldif:/container/services/openldap/assets/schema/openssh-lpk.ldif:ro
      # New volumes for the 2.6 image: the 1.5.0 config dir cannot be reused,
      # and bootstrap only runs when both dirs are empty. Existing data is
      # carried over with ./migrate-ldap.sh (export before, import after).
      - openldap-data:/var/lib/openldap/openldap-data
      - openldap-config:/etc/openldap/slapd.d
    networks:
      - internal

  redis:
    image: redis:8.6.4
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
  traefik:
    external: true

volumes:
  db-data:
  openldap-data:
  openldap-config:
  # The osixia/openldap:1.5.0 volumes (clustron-stage_ldap-data,
  # clustron-stage_ldap-config) are intentionally no longer declared so
  # compose never touches them; keep them for rollback until the migration
  # is confirmed, then `docker volume rm` them by hand.