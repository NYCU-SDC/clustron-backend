name: clustron-local

services:
  postgres:
    image: postgres:18
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clustron
    ports:
      - "5432:5432"

  ldap:
    image: osixia/openldap:2.6.10-alpha
    healthcheck:
      test: ["CMD", "container", "run", "--", "ldapwhoami", "-x", "-H", "ldap://localhost:3890"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      OPENLDAP_BOOTSTRAP_ORGANIZATION: "Clustron"
      OPENLDAP_BOOTSTRAP_SUFFIX: "dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club"
      # nis.ldif (not the image default rfc2307bis) keeps posixGroup STRUCTURAL,
      # and openssh-lpk.ldif provides ldapPublicKey/sshPublicKey (overridden
      # by ./schema so sshPublicKey stays MAY instead of the image's MUST).
      OPENLDAP_BOOTSTRAP_SCHEMAS: "core.ldif cosine.ldif inetorgperson.ldif nis.ldif openssh-lpk.ldif"
      OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: "password"
      OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED: "password"
      CONTAINER_LOG_LEVEL: "debug"
    volumes:
      - ./ldif:/container/services/openldap-bootstrap/assets/ldif/data/custom:ro
      - ./schema/openssh-lpk.ldif:/container/services/openldap/assets/schema/openssh-lpk.ldif:ro
    ports:
      - "389:3890"

  redis:
    image: redis:8.6.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # optional
  ldap_admin:
    image: osixia/phpldapadmin
    ports:
      - "6443:443"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'ldap': [{'server': [{'tls': False},{'port': 3890}]},{'login': [{'bind_id': 'cn=admin,dc=clustron,dc=prj,dc=internal,dc=sdc,dc=nycu,dc=club'},{'bind_pass': 'password'}]}]}]"