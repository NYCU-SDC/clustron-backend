database_url: "YOUR_DATABASE_URL"
base_url: "BASE_URL"
slurm:
  # Leave empty to run without Slurm. All five settings are required to enable it.
  slurm_token_helper_url: ""
  slurm_token_helper_api_key: ""
  slurm_restful_base_url: ""
  slurm_restful_version: ""
  slurm_root_token: ""
debug:
oauth_proxy_base_url:
oauth_proxy_secret:
google_oauth_client_id:
google_oauth_client_secret:
github_oauth_client_id:
github_oauth_client_secret:
nycu_oauth_client_id:
nycu_oauth_client_secret:
casbin_model_source:
casbin_policy_source:
redis_url:
allow_origins:
  - origin1
  - origin2
preset_user:
  'YOUR_EMAIL':
    role: admin
enable_internal_login: false # Set to true if you are in the testing phase.
linux_username_blacklist:
  - blacklist1
  - blacklist2
# Server-local group names that can never be registered as system groups.
# Always added to the built-in list: root, sudo, admin, wheel, adm, shadow, disk, kmem, sys, staff,
# lxd, libvirt, systemd-journal, tty
system_group_denylist: []
ldap:
  ldap_debug: true
  ldap_host: "LDAP_HOST"
  ldap_external_host: "LDAP_EXTERNAL_HOST"
  ldap_port: 389
  ldap_external_port: 636
  # Scheme cluster nodes use to reach LDAP (ldap or ldaps). Defaults to ldaps.
  ldap_external_scheme: "ldaps"
  # CA that managed nodes use to verify the LDAP server. Leave empty to encrypt
  # without verifying (see scripts/create_ldap_certs.sh).
  ldap_ca_cert_file: ""
  ldap_base_dn: "DC=example,DC=com"
  ldap_user_ou_name: "people"
  ldap_group_ou_name: "groups"
  ldap_bind_dn: "CN=admin,DC=example,DC=com"
  ldap_bind_pwd: "YOUR_LDAP_PASSWORD"